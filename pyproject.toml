[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentwin"
version = "0.1.0"
description = "Local corpus preparation for PenTwin's pre-generation evaluation stage"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11,<1", "python-docx>=1.1,<2"]

[project.optional-dependencies]
test = ["reportlab>=4,<5"]

[project.scripts]
pentwin = "pentwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
