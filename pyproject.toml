[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentwin"
version = "0.2.0"
description = "Private corpus preparation and read-only local MCP style tools"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11,<1", "python-docx>=1.1,<2", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["reportlab>=4,<5"]

[project.scripts]
pentwin = "pentwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
